<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#188d45" />
  <meta name="description" content="娃哈哈AD钙奶30周年互动H5：童年风味人格鉴定。测出你的酸甜人格比例，生成专属AD钙奶人格瓶海报。" />
  <title>童年风味人格鉴定｜娃哈哈AD钙奶30周年H5互动测试</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app" class="phone-shell" aria-live="polite">
    <section class="screen screen-cover is-active" data-screen="cover">
      <div class="cover-frame">
        <div class="cover-fill" aria-hidden="true"></div>
        <img class="cover-poster" src="./assets/cover_poster.png?v=cover-bottle-2" alt="娃哈哈AD钙奶30周年童年风味人格鉴定封面" />
        <button class="cover-start-hit" id="startBtn" aria-label="开始测试">开始测试</button>
      </div>
    </section>

    <section class="screen screen-quiz" data-screen="quiz">
      <div class="topbar">
        <button class="ghost-btn" id="backBtn" aria-label="返回上一题">‹</button>
        <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
        <span id="progressText">1/10</span>
      </div>
      <div class="quiz-card">
        <div class="question-tag" id="questionTag">Q1</div>
        <h2 id="questionTitle"></h2>
        <p id="questionDesc"></p>
        <div id="answerList" class="answer-list"></div>
      </div>
    </section>

    <section class="screen screen-result" data-screen="result">
      <div class="result-header">
        <div>
          <span class="small-label">你的酸甜人格比例</span>
          <h2 id="resultName"></h2>
        </div>
        <button class="ghost-btn" id="restartBtn">重测</button>
      </div>

      <div class="ratio-card">
        <div class="ratio-line"><span>酸涩</span><strong id="acidValue">30%</strong></div>
        <div class="meter"><div id="acidMeter"></div></div>
        <div class="ratio-line"><span>回甘</span><strong id="sweetValue">70%</strong></div>
        <div class="meter"><div id="sweetMeter"></div></div>
      </div>

      <div class="poster-preview image-poster" id="posterPreview">
        <img id="resultPosterImage" src="" alt="AD钙奶人格瓶结果海报" />
      </div>

      <div class="action-row">
        <button class="primary-btn" id="savePosterBtn">保存人格海报</button>
        <button class="secondary-btn" id="copyBtn">领取专属兑换券</button>
      </div>
      <a id="downloadLink" class="download-link" download="AD钙奶人格瓶海报.png">如未自动保存，点击这里打开海报</a>
      <p class="microcopy">长按结果海报可保存到相册。每个人都能在AD钙奶里找到自己的快乐平衡。</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="./app.js?v=png-restore-1"></script>
</body>
</html>
